name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          for f in *.user.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Lint
        run: npx --yes eslint@10 .

      - name: Version bumped (PR only)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base" -- auto-close-danmu.user.js; then
            echo "script unchanged, skip"; exit 0
          fi
          old=$(git show "$base:auto-close-danmu.user.js" | grep -m1 '@version' | awk '{print $NF}')
          new=$(grep -m1 '@version' auto-close-danmu.user.js | awk '{print $NF}')
          echo "old=$old new=$new"
          [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ] && [ "$old" != "$new" ] \
            || { echo "::error::脚本改了但 @version 没调高"; exit 1; }

      - name: Tests (if any)
        run: |
          if [ -d tests ]; then node --test tests/*.test.*; else echo "no tests yet"; fi
